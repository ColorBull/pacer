const haversine = (a, b) => {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);

    setTimeout(() => { if (!started) { beep(kind); report?.("silent"); } }, 2500);
  } catch { beep(kind); report?.("error"); }
}

const IStop = () => html`<${Icon} d=${html`<rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/>`}/>`;
const IVol = ({ on }) => html`<${Icon} size=${18} d=${on ? html`<polygon key="a" points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path key="b" d="M15.5 8.5a5 5 0 0 1 0 7"/><path key="c" d="M19 5a10 10 0 0 1 0 14"/>` : html`<polygon key="a" points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line key="b" x1="22" y1="9" x2="16" y2="15"/><line key="c" x1="16" y1="9" x2="22" y2="15"/>`}/>`;
const IClock = () => html`<${Icon} size=${18} d=${html`<path key="a" d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path key="b" d="M3 3v5h5"/><path key="c" d="M12 7v5l3 2"/>`}/>`;
const IX = () => html`<${Icon} d=${html`<line key="a" x1="18" y1="6" x2="6" y2="18"/><line key="b" x1="6" y1="6" x2="18" y2="18"/>`}/>`;

/* ---------- pieces ---------- */
function Stepper({ label, value, onChange, step, min, max, fmt }) {
  return html`<div className="flex items-center justify-between gap-3 py-3 border-b hair">
    <span className="text-[15px]">${label}</span>
    <div className="flex items-center gap-2" dir="ltr">
      <button className="w-10 h-10 rounded-full chip text-xl" aria-label=${`− ${label}`} onClick=${() => onChange(Math.max(min, value - step))}>−</button>
      <span className="num text-2xl w-20 text-center">${fmt(value)}</span>
      <button className="w-10 h-10 rounded-full chip text-xl" aria-label=${`+ ${label}`} onClick=${() => onChange(Math.min(max, value + step))}>+</button>
    </div>
  </div>`;
}

function Toggle({ id, label, sub, on, onChange }) {
  return html`<label htmlFor=${id} className="flex items-center justify-between gap-3 py-3 border-b hair cursor-pointer">
    <span><span className="block text-[15px]">${label}</span>${sub && html`<span className="block text-xs" style=${{ color: "var(--muted)" }}>${sub}</span>`}</span>
    <input id=${id} type="checkbox" className="sr-only" checked=${on} onChange=${e => onChange(e.target.checked)}/>
    <span dir="ltr" className="relative shrink-0 w-12 h-7 rounded-full transition-colors" style=${{ background: on ? "var(--accent)" : "var(--line)" }}>
      <span className="absolute top-1 w-5 h-5 rounded-full transition-all" style=${{ left: on ? "26px" : "4px", background: "var(--fg)" }}></span>
    </span>
  </label>`;
}

function Settings({ s, t, set, close, running }) {
  const [vs, setVs] = useState("");
  const [inst, setInst] = useState(installState);
  useEffect(() => { const f = () => setInst(installState()); installSubs.add(f); return () => installSubs.delete(f); }, []);
  const install = async () => { try { installPrompt.prompt(); await installPrompt.userChoice; } catch {} installPrompt = null; setInst(installState()); };
  return html`<div className="fixed inset-0 z-20 flex items-end sm:items-center justify-center" style=${{ background: "rgba(0,0,0,.6)" }} onClick=${close}>
    <div className="panel w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl gutter pt-4" style=${{ paddingBottom: "calc(20px + env(safe-area-inset-bottom, 0px))", maxHeight: "92%", overflowY: "auto" }} onClick=${e => e.stopPropagation()}>
      <div className="flex items-center justify-between mb-2">
        <h2 className="num text-2xl font-semibold uppercase tracking-wide">${t.runSettings}</h2>
        <button className="w-10 h-10 flex items-center justify-center rounded-full" aria-label=${t.close} onClick=${close}><${IX}/></button>
      </div>
      <div className="label mt-2">${t.language}</div>
      <div className="grid grid-cols-2 gap-2 mt-2">
        ${[["he", "עברית"], ["en", "English"]].map(([k, name]) => html`
          <button key=${k} className=${`chip rounded-xl h-11 font-semibold ${s.lang === k ? "on" : ""}`} onClick=${() => set({ lang: k })}>${name}</button>`)}
      </div>
      <div className="label mt-5">${t.target}</div>
      <${Stepper} label=${t.targetPace} value=${s.target} step=${5} min=${150} max=${720} fmt=${fmtPace} onChange=${v => set({ target: v })}/>
      <${Stepper} label=${t.tolerance} value=${s.tol} step=${5} min=${5} max=${60} fmt=${v => `${v}${t.sec}`} onChange=${v => set({ tol: v })}/>
      <div className="label mt-5">${t.voiceCoach}</div>
      <${Toggle} id="opt-voice" label=${t.paceAlerts} sub=${t.paceAlertsSub} on=${s.voice} onChange=${v => set({ voice: v })}/>
      <${Toggle} id="opt-splits" label=${t.announceKm} sub=${t.announceKmSub} on=${s.splitVoice} onChange=${v => set({ splitVoice: v })}/>
      <button className="mt-3 w-full h-11 rounded-xl chip" onClick=${() => { unlockAudio(); setVs("trying"); speak(t.vCheck(t.sayPace(s.target)), true, t.speech, "info", setVs); }}>${t.testVoice}</button>
      ${vs && html`<p className="text-xs mt-2" role="status" style=${{ color: vs === "playing" ? "var(--good)" : "var(--warn)" }}>${t.vs[vs]}</p>`}
      <div className="label mt-5">${t.source}</div>
      <div className="grid grid-cols-2 gap-2 mt-2">
        ${[["sim", t.sim, t.simSub], ["gps", t.gps, t.gpsSub]].map(([k, name, sub]) => html`
          <button key=${k} disabled=${running} className=${`chip rounded-xl p-3 text-start ${s.mode === k ? "on" : ""} ${running ? "opacity-50" : ""}`} onClick=${() => set({ mode: k })}>
            <span className="block font-semibold">${name}</span><span className="block text-xs">${sub}</span>
          </button>`)}
      </div>
      ${running && html`<p className="text-xs mt-2" style=${{ color: "var(--muted)" }}>${t.switchHint}</p>`}
      ${inst !== "hidden" && html`<div>
        <div className="label mt-5">${t.installTitle}</div>
        ${inst === "prompt" ? html`<button className="go mt-2 w-full h-11 rounded-xl font-semibold" onClick=${install}>${t.installBtn}</button>`
          : html`<p className="text-sm mt-2" style=${{ color: inst === "installed" ? "var(--good)" : "var(--muted)" }}>${inst === "installed" ? t.installed : inst === "ios" ? t.installIos : t.installOther}</p>`}
      </div>`}
    </div>
  </div>`;
}

function History({ t, lang, close }) {
  const [runs, setRuns] = useState(loadRuns);
  const [open, setOpen] = useState(null), [armed, setArmed] = useState(null);
  const remove = id => {
    if (armed !== id) { setArmed(id); setTimeout(() => setArmed(a => a === id ? null : a), 3000); return; }
    const next = runs.filter(x => x.id !== id); saveRuns(next); setRuns(next); setArmed(null);
  };
  const totalKm = runs.reduce((a, x) => a + x.dist, 0) / 1000;
  const when = ms => new Date(ms).toLocaleString(lang === "he" ? "he-IL" : "en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  return html`<div className="fixed inset-0 z-20 flex items-end sm:items-center justify-center" style=${{ background: "rgba(0,0,0,.6)" }} onClick=${close}>
    <div className="panel w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl gutter pt-4" style=${{ paddingBottom: "calc(20px + env(safe-area-inset-bottom, 0px))", maxHeight: "92%", overflowY: "auto" }} onClick=${e => e.stopPropagation()}>
      <div className="flex items-center justify-between mb-1">
        <h2 className="num text-2xl font-semibold uppercase tracking-wide">${t.history}</h2>
        <button className="w-10 h-10 flex items-center justify-center rounded-full" aria-label=${t.closeHistory} onClick=${close}><${IX}/></button>
      </div>
      ${runs.length > 0 && html`<p className="text-sm mb-2" style=${{ color: "var(--muted)" }}>${t.runs(runs.length)} · ${t.total} <span className="num text-base" style=${{ color: "var(--fg)" }}>${totalKm.toFixed(1)}</span> ${t.perKm.replace("/", "")}</p>`}
      ${runs.length === 0 && html`<p className="py-6 text-sm" style=${{ color: "var(--muted)" }}>${t.noRuns}</p>`}
      <ul>
        ${runs.map(x => html`<li key=${x.id} className="border-b hair">
          <button className="w-full flex items-center justify-between gap-3 py-3 text-start" aria-expanded=${open === x.id} onClick=${() => setOpen(open === x.id ? null : x.id)}>
            <span className="min-w-0"><span className="block text-sm" style=${{ color: "var(--muted)" }}>${when(x.date)}</span>
              <span className="num text-2xl font-semibold">${(x.dist / 1000).toFixed(2)}</span><span className="text-sm" style=${{ color: "var(--muted)" }}> ${t.distance.replace(/^[^(]*\(|\)$/g, "")}</span></span>
            <span className="text-end shrink-0" dir="ltr"><span className="block num text-xl">${fmtTime(x.elapsed)}</span><span className="block num text-sm" style=${{ color: "var(--muted)" }}>${fmtPace(x.elapsed / x.dist)}</span></span>
          </button>
          ${open === x.id && html`<div className="pb-3">
            ${x.splits.map((secs, i) => html`<div key=${i} className="flex justify-between text-sm py-0.5"><span className="num">${i + 1}</span><span className="num" style=${{ color: Math.abs(secs - x.target) <= (x.tol || 10) ? "var(--good)" : secs > x.target ? "var(--bad)" : "var(--warn)" }}>${fmtPace(secs)}</span></div>`)}
            <div className="flex justify-between items-center mt-2 text-sm"><span style=${{ color: "var(--muted)" }}>${t.target} ${fmtPace(x.target)}</span>
              <button className="chip rounded-full px-4 h-9" style=${armed === x.id ? { borderColor: "var(--bad)", color: "var(--bad)" } : {}} onClick=${() => remove(x.id)}>${armed === x.id ? t.confirmDel : t.del}</button></div>
          </div>`}
        </li>`)}
      </ul>
    </div>
  </div>`;
}

/* ---------- app ---------- */
function App() {
  const [s, setS] = useState(() => ({ target: 330, tol: 10, voice: true, splitVoice: true, mode: "sim", simPace: 330, lang: "he", ...load() }));
  const set = patch => setS(prev => { const next = { ...prev, ...patch }; save(next); return next; });
  const sRef = useRef(s); sRef.current = s;
  const t = T[s.lang] || T.en;

  useEffect(() => { document.documentElement.dir = t.dir; document.documentElement.lang = s.lang; }, [s.lang]);
  useEffect(() => { try { speechSynthesis.getVoices(); } catch {} }, []); // warm the voice list

  const fresh = () => ({ elapsed: 0, dist: 0, splitT: 0, splitD: 0, splits: [], samples: [], speed: 0, pace: NaN, coach: "idle", lastCueAt: -1e9, lastCue: "ok", lastPos: null, jitter: 0 });
  const run = useRef(fresh());
  const [, render] = useState(0);
  const [running, setRunning] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [notice, setNotice] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);
  const watchId = useRef(null), wake = useRef(null);

  const tick = useCallback((dt) => {
    const r = run.current, st = sRef.current, tt = T[st.lang] || T.en;
    r.elapsed += dt;
    if (st.mode === "sim") {
      r.jitter = Math.max(-0.06, Math.min(0.06, r.jitter * 0.97 + (Math.random() - 0.5) * 0.012));
      r.speed = (1000 / st.simPace) * (1 + r.jitter);
      r.dist += r.speed * dt / 1000;
    }
    r.samples.push({ t: r.elapsed, d: r.dist });
    while (r.samples.length && r.elapsed - r.samples[0].t > WINDOW_MS) r.samples.shift();
    const first = r.samples[0], dd = r.dist - first.d, dtw = (r.elapsed - first.t) / 1000;
    r.pace = dd > 5 && dtw > 3 ? dtw / (dd / 1000) : NaN;

    // kilometer splits
    while (r.dist - r.splitD >= 1000) {
      const secs = (r.elapsed - r.splitT) / 1000;
      r.splits.push(secs); r.splitT = r.elapsed; r.splitD += 1000;
      speak(tt.vKm(r.splits.length, tt.sayPace(secs)), st.splitVoice, tt.speech, "km");
    }

    // coaching
    if (r.elapsed > WARMUP_MS && isFinite(r.pace)) {
      const c = classify(r.pace, st.target, st.tol);
      r.coach = c;
      const changed = c !== r.lastCue, due = r.elapsed - r.lastCueAt > REPEAT_MS;
      if (c !== "ok" && (changed || due)) {
        speak(c === "slow" ? tt.vSpeedUp(tt.sayPace(r.pace)) : tt.vSlowDown(tt.sayPace(r.pace)), st.voice, tt.speech, c);
        r.lastCueAt = r.elapsed; r.lastCue = c;
      } else if (c === "ok" && changed) {
        speak(tt.vBackOn, st.voice, tt.speech, "ok");
        r.lastCueAt = r.elapsed; r.lastCue = c;
      }
    } else r.coach = "warmup";
    render(x => x + 1);
  }, []);

  useEffect(() => {
    if (!running) return;
    let last = performance.now();
    const id = setInterval(() => { const now = performance.now(); tick(now - last); last = now; }, 250);
    return () => clearInterval(id);
  }, [running, tick]);

  const startGps = () => {
    if (!("geolocation" in navigator)) { setNotice("noGeo"); return false; }
    run.current.lastPos = null;
    watchId.current = navigator.geolocation.watchPosition(p => {
      const r = run.current, { latitude: lat, longitude: lon, accuracy } = p.coords;
      if (accuracy > 30) return; // shortcut: fixed accuracy gate; a Kalman filter would smooth better on bad signal
      const pos = { lat, lon };
      if (r.lastPos) { const d = haversine(r.lastPos, pos); if (d > 2 && d < 100) { r.dist += d; r.lastPos = pos; } }
      else r.lastPos = pos;
      setNotice("");
    }, err => setNotice(err.code === 1 ? "blocked" : "waiting"), { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    return true;
  };
  const stopGps = () => { if (watchId.current != null) navigator.geolocation.clearWatch(watchId.current); watchId.current = null; };

  const toggle = async () => {
    unlockAudio();
    setConfirmReset(false);
    if (running) {
      setRunning(false); stopGps(); speak(t.vPause, s.voice, t.speech);
      try { await wake.current?.release(); } catch {} wake.current = null;
      return;
    }
    if (s.mode === "gps" && !startGps()) return;
    if (s.mode === "gps") setNotice("waiting");
    speak(run.current.elapsed ? t.vResume : t.vStart(t.sayPace(s.target)), s.voice, t.speech);
    try { wake.current = await navigator.wakeLock?.request("screen"); } catch {}
    setRunning(true);
  };

  const finish = () => {
    if (!confirmReset) { setConfirmReset(true); setTimeout(() => setConfirmReset(false), 3000); return; }
    const r = run.current;
    if (r.dist > 10) saveRuns([{ id: Date.now(), date: Date.now() - r.elapsed, dist: r.dist, elapsed: r.elapsed, splits: r.splits, target: s.target, tol: s.tol, mode: s.mode }, ...loadRuns()]);
    if (r.dist > 10) speak(t.vFinish((r.dist / 1000).toFixed(2), fmtTime(r.elapsed).replace(/^00:/, "")), s.voice, t.speech);
    setRunning(false); stopGps(); run.current = fresh(); setConfirmReset(false); setNotice(""); render(x => x + 1);
  };

  const r = run.current;
  const curSplitD = r.dist - r.splitD;
  const splitPace = curSplitD > 20 ? ((r.elapsed - r.splitT) / 1000) / (curSplitD / 1000) : NaN;
  const avgPace = r.dist > 20 ? (r.elapsed / 1000) / (r.dist / 1000) : NaN;
  const coachUI = {
    idle: [t.ready, "var(--muted)", t.pressStart],
    warmup: [t.settling, "var(--muted)", t.settlingSub],
    ok: [t.onTarget, "var(--good)", t.onTargetSub(s.tol, fmtPace(s.target))],
    slow: [t.speedUp, "var(--bad)", t.speedUpSub(fmtPace(s.target + s.tol))],
    fast: [t.slowDown, "var(--warn)", t.slowDownSub(fmtPace(s.target - s.tol))],
  }[running || r.elapsed ? r.coach : "idle"] || [t.ready, "var(--muted)", ""];

  const rows = [...r.splits.map((secs, i) => ({ km: i + 1, secs, done: true })), ...(r.dist > 0 ? [{ km: r.splits.length + 1, secs: splitPace, done: false, part: curSplitD }] : [])].reverse();
  const unit = html`<span className="text-sm" style=${{ color: "var(--muted)" }}> ${t.perKm}</span>`;

  return html`<div className="h-full flex flex-col max-w-md mx-auto">
    <header className="gutter pt-3 pb-2 flex items-center justify-between gap-3">
      <span className="chip on rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-wider">${s.mode === "sim" ? t.sim : t.gps}</span>
      <div className="flex items-center gap-2" dir="ltr">
        ${running && html`<span className="w-2 h-2 rounded-full live" style=${{ background: "var(--accent)" }}></span>`}
        <span className="num text-4xl font-semibold">${fmtTime(r.elapsed)}</span>
      </div>
      <div className="flex items-center gap-2">
        <button className="flex items-center chip rounded-full px-3 py-1" aria-label=${t.history} onClick=${() => setShowHistory(true)}><${IClock}/></button>
        <button className="flex items-center chip rounded-full px-3 py-1" aria-label=${t.toggleVoice} onClick=${() => set({ voice: !s.voice })}><${IVol} on=${s.voice}/></button>
      </div>
    </header>

    <section className="gutter grid grid-cols-3 gap-2 py-3 border-y hair">
      <div><div className="label">${t.splitAvg}</div><div className="num text-3xl font-semibold">${fmtPace(splitPace)}${unit}</div></div>
      <div className="text-center"><div className="label">${t.current}</div><div className="num text-3xl font-semibold">${fmtPace(r.pace)}</div></div>
      <div className="text-end"><div className="label">${t.target}</div><div className="num text-3xl font-semibold" style=${{ color: "var(--accent)" }}>${fmtPace(s.target)}</div></div>
    </section>

    <main className="flex-1 min-h-0 flex flex-col">
      <div className="text-center pt-4 pb-2 gutter">
        <div className="num font-bold leading-none" style=${{ fontSize: "clamp(88px, 30vw, 140px)" }}>${(r.dist / 1000).toFixed(2)}</div>
        <div className="label mt-1">${t.distance}</div>
        <div className="flex justify-center gap-5 mt-2 text-sm" style=${{ color: "var(--muted)" }}>
          <span>${t.avg} <span className="num text-base" style=${{ color: "var(--fg)" }}>${fmtPace(avgPace)}</span> ${t.perKm}</span>
          <span>${t.speed} <span className="num text-base" style=${{ color: "var(--fg)" }}>${(r.dist > 0 && running ? r.speed * 3.6 || (isFinite(r.pace) ? 3600 / r.pace : 0) : 0).toFixed(1)}</span> ${t.kmh}</span>
        </div>
      </div>

      <div className="gutter">
        <div className="rounded-xl px-4 py-2.5 flex items-center justify-between gap-3" style=${{ border: `1px solid ${coachUI[1]}`, background: `color-mix(in srgb, ${coachUI[1]} 12%, transparent)` }} role="status" aria-live="polite">
          <span className="num text-2xl font-semibold uppercase tracking-wide" style=${{ color: coachUI[1] }}>${coachUI[0]}</span>
          <span className="text-xs text-end" style=${{ color: "var(--muted)" }}>${coachUI[2]}</span>
        </div>
        ${notice && html`<p className="text-xs mt-2" style=${{ color: "var(--warn)" }}>${t[notice]}</p>`}
      </div>

      <div className="gutter mt-3 flex-1 min-h-0 flex flex-col">
        <div className="flex justify-between label pb-1 border-b hair"><span>${t.splitsKm}</span><span>${t.pacePerKm}</span></div>
        <ol className="flex-1 min-h-0 overflow-y-auto">
          ${rows.length === 0 && html`<li className="py-4 text-sm" style=${{ color: "var(--muted)" }}>${t.emptySplits}</li>`}
          ${rows.map(row => {
            const diff = row.secs - s.target, ok = isFinite(row.secs);
            const col = !ok ? "var(--muted)" : Math.abs(diff) <= s.tol ? "var(--good)" : diff > 0 ? "var(--bad)" : "var(--warn)";
            const w = ok ? Math.max(8, Math.min(100, (s.target / row.secs) * 70)) : 0;
            return html`<li key=${row.km} className="flex items-center gap-3 py-2 border-b hair">
              <span className="num text-xl w-12" style=${{ color: row.done ? "var(--fg)" : "var(--muted)" }}>${row.done ? row.km : `${row.km}·`}</span>
              <span className="flex-1 h-2 rounded-full" style=${{ background: "var(--line)" }}><span className="block h-2 rounded-full" style=${{ width: `${w}%`, background: col, opacity: row.done ? 1 : .5 }}></span></span>
              <span className="num text-xl w-14 text-end">${fmtPace(row.secs)}</span>
              <span className="num text-sm w-12 text-end" dir="ltr" style=${{ color: col }}>${ok && row.done ? `${diff > 0 ? "+" : "−"}${Math.abs(Math.round(diff))}${t.sec}` : row.done ? "" : `${Math.round(row.part)}${t.m}`}</span>
            </li>`;
          })}
        </ol>
      </div>

      ${s.mode === "sim" && html`<div className="gutter py-2 border-t hair">
        <div className="flex items-center justify-between"><span className="label">${t.simPace}</span><span className="num text-lg">${fmtPace(s.simPace)}${unit}</span></div>
        <input id="sim-pace" type="range" min="150" max="600" step="5" value=${s.simPace} onInput=${e => set({ simPace: +e.target.value })} aria-label=${t.simPace}/>
        <div className="grid grid-cols-3 gap-2 mt-1">
          ${[[t.tooSlow, s.target + s.tol + 30], [t.onPace, s.target], [t.tooFast, s.target - s.tol - 30]].map(([name, v]) => html`
            <button key=${name} className=${`chip rounded-lg h-9 text-sm ${s.simPace === v ? "on" : ""}`} onClick=${() => set({ simPace: Math.max(150, v) })}>${name}</button>`)}
        </div>
      </div>`}
    </main>

    <footer className="gutter pt-3 flex items-center justify-between border-t hair" style=${{ paddingBottom: "calc(14px + env(safe-area-inset-bottom, 0px))" }}>
      <button className="w-28 h-12 rounded-full chip flex items-center justify-center gap-2 text-sm font-semibold disabled:opacity-40" style=${confirmReset ? { borderColor: "var(--bad)", color: "var(--bad)" } : {}} disabled=${!r.elapsed} onClick=${finish}>
        <${IStop}/>${confirmReset ? t.tapAgain : t.finish}
      </button>
      <button className="go w-20 h-20 rounded-full flex items-center justify-center" aria-label=${running ? t.pause : t.start} onClick=${toggle}>
        ${running ? html`<${IPause}/>` : html`<${IPlay}/>`}
      </button>
      <button className="w-28 h-12 rounded-full chip flex items-center justify-center gap-2 text-sm font-semibold" onClick=${() => setShowSettings(true)}>
        <${IGear}/>${t.settings}
      </button>
    </footer>

    ${showSettings && html`<${Settings} s=${s} t=${t} set=${set} running=${running || r.elapsed > 0} close=${() => setShowSettings(false)}/>`}
    ${showHistory && html`<${History} t=${t} lang=${s.lang} close=${() => setShowHistory(false)}/>`}
  </div>`;
}
